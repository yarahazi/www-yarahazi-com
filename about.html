<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>About | やらはじ公式サイト</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
</head>

<body>

<!-- Header -->
<div id="header"></div>

<!-- Page Title -->
<section class="page-title">
  <div class="page-title-inner">
    <h1>ABOUT</h1>
    <p>やらはじについて</p>
  </div>
</section>

<!-- Profile -->
<section class="about-section">
  <div class="about-inner">

    <div class="about-text">

      <h2>プロフィール</h2>

      <dl class="profile-list">

        <dt>名前</dt>
        <dd>やらはじ</dd>

        <dt>性別</dt>
        <dd>男の子</dd>

        <dt>配信開始日</dt>
        <dd>2021.04.18</dd>

        <dt>コメント</dt>
        <dd>
          どうもみなさんこんにちは、やらはじです！<br>
          「やりたいことをやりたい時に全力で楽しむ！」を目標に、
          YouTubeをメインに活動しています。
        </dd>

      </dl>

    </div>

    <div class="about-image">
      <img src="image/index/yarahazi.png" alt="やらはじ">
    </div>

  </div>
</section>

<!-- SNS -->
<section class="sns-section">

  <div class="sns-inner">

    <h2>SNS</h2>

    <div class="sns-grid">

      <a
        class="sns-button sns-youtube"
        href="https://www.youtube.com/@yarahazi_nnp"
        target="_blank"
        rel="noopener noreferrer"
      >
        YouTube
      </a>

      <a
        class="sns-button sns-x"
        href="https://x.com/yarahazi_nnp"
        target="_blank"
        rel="noopener noreferrer"
      >
        X
      </a>

      <a
        class="sns-button sns-instagram"
        href="https://www.instagram.com/yarahazi_nnp"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

    </div>

  </div>

</section>

<!-- Footer -->
<div id="footer"></div>

<!-- Theme Toggle -->
<button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
  <span class="theme-icon" id="theme-icon">◐</span>
</button>

<!-- Scripts -->
<script src="js/header.js"></script>
<script src="js/theme.js"></script>
<script src="/common.js"></script>

</body>
</html>
